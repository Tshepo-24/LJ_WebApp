spring.application.name=LJ-PLANT-HIRE-BACKEND

spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/lj_plant_hire?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:Tshepo}
server.port=${PORT:8080}
